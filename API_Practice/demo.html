<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fetch API Example</title>
</head>
<body>

<script>
fetch("https://jsonplaceholder.typicode.com/posts")
.then((res) => {
    if (res.ok) {
        console.log("fetching data");
    } else {
        console.log("failed to fetch");
    }
    return res;
})
.then((res) => res.json())
.then((data) => console.log(data));
</script>

</body>
</html>
